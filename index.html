<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HYPERLOCAL IMT</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- LOGIN -->
  <section id="loginPage" class="page">

    <div class="login-card">

      <div class="logo">HYPERLOCAL IMT</div>
      <div class="subtitle">IMT Operations Dashboard</div>

      <input
        type="text"
        id="casperId"
        placeholder="Enter Casper ID"
        autocomplete="off"
      >

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
      >

      <button class="primary-btn" onclick="login()">
        LOGIN
      </button>

      <div id="loginMessage" class="message"></div>

    </div>

  </section>


  <!-- USER APP -->
  <section id="userPage" class="page hidden">

    <header class="topbar">

      <div>
        <div class="app-title">HYPERLOCAL IMT</div>
        <div id="userInfo"></div>
      </div>

      <button class="logout-btn" onclick="logout()">
        Logout
      </button>

    </header>


    <main class="container">

      <!-- WID -->
      <div class="card">

        <label>WID / FSN</label>

        <div class="search-row">

          <input
            id="wid"
            placeholder="Scan / Enter WID or FSN"
            autocomplete="off"
          >

          <button onclick="searchProduct()">
            SEARCH
          </button>

        </div>

        <div id="productMessage" class="message"></div>

      </div>


      <!-- PRODUCT -->
      <div id="productCard" class="card hidden">

        <h3>Product Details</h3>

        <div class="details">

          <div>
            <span>WID / FSN</span>
            <b id="displayWid"></b>
          </div>

          <div>
            <span>Product</span>
            <b id="productName"></b>
          </div>

          <div>
            <span>Dim Category</span>
            <b id="dimCategory"></b>
          </div>

          <div>
            <span>Vertical</span>
            <b id="vertical"></b>
          </div>

        </div>

      </div>


      <!-- LOCATIONS -->
      <div id="locationCard" class="card hidden">

        <h3>Select Location</h3>

        <div id="locations"></div>

      </div>


      <!-- SUBMISSION -->
      <div id="submitCard" class="card hidden">

        <h3>Issue Details</h3>

        <div class="selected-location">

          Selected Location:

          <strong id="selectedLocation"></strong>

        </div>


        <label>Quantity</label>

        <input
          type="number"
          id="quantity"
          min="1"
          placeholder="Enter quantity"
          oninput="calculateValue()"
        >


        <label>MRP</label>

        <input
          type="number"
          id="mrp"
          min="0"
          step="0.01"
          placeholder="Enter MRP"
          oninput="calculateValue()"
        >


        <div class="value-box">

          Value:

          <strong id="value">
            ₹0.00
          </strong>

        </div>


        <label>Issue</label>

        <div class="issue-grid">

          <button onclick="selectIssue(this,'Damage')">
            Damage
          </button>

          <button onclick="selectIssue(this,'Expiry')">
            Expiry
          </button>

          <button onclick="selectIssue(this,'Near Expiry')">
            Near Expiry
          </button>

          <button onclick="selectIssue(this,'Pilferage')">
            Pilferage
          </button>

          <button onclick="selectIssue(this,'Rat/Cat Damage')">
            Rat/Cat Damage
          </button>

          <button onclick="selectIssue(this,'Leakage')">
            Leakage
          </button>

          <button onclick="selectIssue(this,'Broken')">
            Broken
          </button>

          <button onclick="selectIssue(this,'Other')">
            Other
          </button>

        </div>


        <input
          id="otherIssue"
          class="hidden"
          placeholder="Enter other issue"
        >


        <label>Remarks</label>

        <textarea
          id="remarks"
          placeholder="Enter remarks"
        ></textarea>


        <label class="confirm">

          <input
            type="checkbox"
            id="confirm"
          >

          I confirm the selected location and quantity.

        </label>


        <button
          class="submit-btn"
          onclick="submitIssue()"
        >
          SUBMIT
        </button>

        <div id="submitMessage" class="message"></div>

      </div>

    </main>

  </section>

</div>


<script src="app.js"></script>

</body>
</html>
